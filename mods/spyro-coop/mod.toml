# spyro-coop: split-screen co-op for Spyro the Dragon, on OpenPete.
#
# STATUS: phase A of docs/PORT-INVENTORY.md. A second Spyro whose tick and
# camera update run every frame alongside player 1's, borrowing player 1's
# input. An experimental draw tries to show him using the game's own Spyro
# renderers; the swap_view key trades identities either way. It also carries
# the collision guards, the controller 2 probe, and a measurement of when the
# game polls input. Phase B part 1 adds nearest-player mobys, player 2's own
# Sparx, the dragons pushing apart, and separate death and respawn.
#
# uses: `api->override_name` - Spyro's tick, CameraUpdate, two collision routines, PadVSync
# uses: `api->override_name` (more) - the environment update and moby list builder, for the moby passes
# uses: `api->base` - called twice per frame in the tick and camera overrides, once per player
# uses: `api->guest_alloc` - one arena for all per-player state, carried by savestates and rewind
# uses: `api->guest` - swapping state into and out of the game's own globals
# uses: `api->call` - running the game's model, shadow and flame renderers for player 2
# uses: `api->binding_down` - the swap_view development key, and players 2-4's controller
# uses: `api->data_dir` - settings.txt, shared by the in-game menu and the M panel
# uses: openpete_mod_ui.h - the settings panel in the M overlay
# uses: `api->register_toggle_hook` - stands player 2 down if the mod is disabled mid-level
# uses: `api->ui_status` / `api->log` - the readout

[mod]
id      = "spyro-coop"
name    = "Spyro Co-Op"
version = "0.11.0"
game    = "spyro-1"
api     = 1

# Writes guest RAM every frame: that is the whole technique.
sim_mutative = true

# Every value derived from game history lives in the guest arena, which the
# engine carries through a jump like guest RAM. The only host statics are
# display counters and the config switch, neither of which gameplay reads.
state = "rebuildable"

# Logs from tick hooks, which the engine may suppress during speculation.
runahead = "host-fx"

[[binding]]
name    = "swap_view"
key     = "P"
purpose = "switch the camera to the other dragon (development aid)"

# Players 2 to 4 (coop_players.c, CONTROLS). "pad:" is the first controller;
# rebind to "pad2:..." for a second one.
[[binding]]
name    = "extra_cross"
key     = "pad:south"
purpose = "players 2-4: cross"

[[binding]]
name    = "extra_circle"
key     = "pad:east"
purpose = "players 2-4: circle"

[[binding]]
name    = "extra_square"
key     = "pad:west"
purpose = "players 2-4: square"

[[binding]]
name    = "extra_triangle"
key     = "pad:north"
purpose = "players 2-4: triangle"

[[binding]]
name    = "extra_l1"
key     = "pad:leftshoulder"
purpose = "players 2-4: L1"

[[binding]]
name    = "extra_r1"
key     = "pad:rightshoulder"
purpose = "players 2-4: R1"

[[binding]]
name    = "extra_l2"
key     = "pad:lefttrigger"
purpose = "players 2-4: L2"

[[binding]]
name    = "extra_r2"
key     = "pad:righttrigger"
purpose = "players 2-4: R2"

[[binding]]
name    = "extra_up"
key     = "pad:dpup"
purpose = "players 2-4: d-pad up"

[[binding]]
name    = "extra_down"
key     = "pad:dpdown"
purpose = "players 2-4: d-pad down"

[[binding]]
name    = "extra_left"
key     = "pad:dpleft"
purpose = "players 2-4: d-pad left"

[[binding]]
name    = "extra_right"
key     = "pad:dpright"
purpose = "players 2-4: d-pad right"

[[binding]]
name    = "extra_stick_up"
key     = "pad:-lefty"
purpose = "players 2-4: left stick up"

[[binding]]
name    = "extra_stick_down"
key     = "pad:lefty"
purpose = "players 2-4: left stick down"

[[binding]]
name    = "extra_stick_left"
key     = "pad:-leftx"
purpose = "players 2-4: left stick left"

[[binding]]
name    = "extra_stick_right"
key     = "pad:leftx"
purpose = "players 2-4: left stick right"
